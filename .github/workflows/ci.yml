name: CI

on:
  push:
    branches: [main, master, '*.x']
  pull_request:
    branches: [main, master, '*.x']
    types: [opened, synchronize, reopened, ready_for_review]
  # Dependants track this package by dev-master, so a green build here can go
  # stale without a single commit on either side. Re-run weekly.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  # Keyed by event too: without it a push to master shares a group with the
  # scheduled run on the same ref and cancel-in-progress kills the canary.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: ['10', '11', '12']
        include:
          - laravel: '10'
            testbench: '8'
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
        exclude:
          # Laravel 11+ requires PHP 8.2+
          - php: '8.1'
            laravel: '11'
          - php: '8.1'
            laravel: '12'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          composer update \
            --with="orchestra/testbench:^${{ matrix.testbench }}.0" \
            --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --colors=always

  tests-pgsql:
    # SQLite never rewrites `?` placeholders, so SQL that only breaks PDO drivers
    # which do (pdo_pgsql) passes the main matrix unnoticed.
    name: Filters on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: query_wizard
          POSTGRES_USER: query_wizard
          POSTGRES_PASSWORD: query_wizard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U query_wizard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, json, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run filter tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: query_wizard
          DB_USERNAME: query_wizard
          DB_PASSWORD: query_wizard
        # Other filter tests still assume SQLite (SQL strings, loose type comparisons); widen as they become driver-neutral.
        run: vendor/bin/phpunit --group partial-filter --colors=always

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-phpstan-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-phpstan-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

  downstream-elastic:
    name: Downstream (elastic-query-wizard)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout laravel-query-wizard
        uses: actions/checkout@v4
        with:
          path: laravel-query-wizard

      - name: Checkout elastic-query-wizard
        uses: actions/checkout@v4
        with:
          repository: jackardios/elastic-query-wizard
          ref: master
          path: elastic-query-wizard

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-downstream-composer-${{ hashFiles('elastic-query-wizard/composer.json') }}
          restore-keys: ${{ runner.os }}-downstream-composer-

      # elastic-query-wizard requires jackardios/laravel-query-wizard:dev-master.
      # Resolve that constraint against this checkout instead of Packagist, so the
      # commit under test is the one the downstream package is compiled against.
      - name: Resolve the dependency against this checkout
        working-directory: elastic-query-wizard
        run: |
          composer config repositories.laravel-query-wizard \
            '{"type":"path","url":"../laravel-query-wizard","options":{"symlink":false,"versions":{"jackardios/laravel-query-wizard":"dev-master"}}}'

      - name: Install dependencies
        working-directory: elastic-query-wizard
        run: composer update --prefer-dist --no-interaction --no-progress

      # Guards against the path repository being silently ignored, which would
      # turn this job into a second copy of the downstream package's own CI.
      - name: Confirm the local checkout was used
        working-directory: elastic-query-wizard
        run: |
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true);
            foreach ($lock["packages"] as $package) {
                if ($package["name"] !== "jackardios/laravel-query-wizard") {
                    continue;
                }
                $type = $package["dist"]["type"] ?? "?";
                echo "resolved from: {$type}\n";
                exit($type === "path" ? 0 : 1);
            }
            fwrite(STDERR, "jackardios/laravel-query-wizard is not installed\n");
            exit(1);
          '

      - name: Run PHPStan
        working-directory: elastic-query-wizard
        run: vendor/bin/phpstan analyse --memory-limit=512M

      # The Unit suite needs no Elasticsearch or MySQL and is what catches a
      # removed or reshaped base-class method.
      - name: Run unit tests
        working-directory: elastic-query-wizard
        run: vendor/bin/phpunit --testsuite=Unit --colors=always

  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-style-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-style-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
