name: CI

on:
  push:
    branches: [main, master, '*.x']
  pull_request:
    branches: [main, master, '*.x']
    types: [opened, synchronize, reopened, ready_for_review]
  # Dependants track this package by dev-master, so a green build here can go
  # stale without a single commit on either side. Re-run weekly.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  # Keyed by event too: without it a push to master shares a group with the
  # scheduled run on the same ref and cancel-in-progress kills the canary.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: ['highest']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          - php: '8.2'
            laravel: '12'
            testbench: '10'
            dependencies: 'lowest'
            framework-floor: '12.61.1'
          - php: '8.3'
            laravel: '13'
            testbench: '11'
            dependencies: 'lowest'
            framework-floor: '13.12.0'
        exclude:
          # Laravel 13 requires PHP 8.3+
          - php: '8.2'
            laravel: '13'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-composer-

      # PHPUnit 12 legs also run the suite in parallel; paratest ^7.17 is the
      # first line that supports PHPUnit 12.5.8, and 7.21+ requires PHPUnit 13.
      - name: Add paratest
        if: matrix.laravel == '13' && matrix.dependencies == 'highest'
        run: composer require --dev "brianium/paratest:^7.17" --no-update --no-interaction

      - name: Install dependencies
        run: |
          composer update \
            --with="laravel/framework:^${{ matrix.laravel }}.0" \
            --with="orchestra/testbench:^${{ matrix.testbench }}.0" \
            ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }} \
            --prefer-dist --no-interaction --no-progress

      # A lowest leg that silently resolves above the declared floor stops
      # testing the floor at all.
      - name: Confirm the declared framework floor was installed
        if: matrix.dependencies == 'lowest'
        run: |
          installed=$(composer show laravel/framework --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')
          echo "laravel/framework ${installed}"
          test "${installed}" = "v${{ matrix.framework-floor }}"

      - name: Run tests
        run: vendor/bin/phpunit --colors=always

      - name: Run tests in parallel
        if: matrix.laravel == '13' && matrix.dependencies == 'highest'
        run: vendor/bin/paratest --processes=4 --colors

  tests-pgsql:
    # SQLite never rewrites `?` placeholders, so SQL that only breaks PDO drivers
    # which do (pdo_pgsql) passes the main matrix unnoticed.
    name: PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: query_wizard
          POSTGRES_USER: query_wizard
          POSTGRES_PASSWORD: query_wizard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U query_wizard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: query_wizard
          DB_USERNAME: query_wizard
          DB_PASSWORD: query_wizard
        # pgsql-known-failure: package bugs that only PostgreSQL rejects, each removed with its fix.
        run: vendor/bin/phpunit --exclude-group pgsql-known-failure --colors=always

  static-analysis:
    name: Static Analysis (PHPStan, PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
          - php: '8.5'
            laravel: '13'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-phpstan-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-phpstan-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer update --with="laravel/framework:^${{ matrix.laravel }}.0" --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

  downstream-elastic:
    name: Downstream (elastic-query-wizard)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout laravel-query-wizard
        uses: actions/checkout@v7
        with:
          path: laravel-query-wizard

      - name: Checkout elastic-query-wizard
        uses: actions/checkout@v7
        with:
          repository: jackardios/elastic-query-wizard
          ref: master
          path: elastic-query-wizard

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-downstream-composer-${{ hashFiles('elastic-query-wizard/composer.json') }}
          restore-keys: ${{ runner.os }}-downstream-composer-

      # elastic-query-wizard requires jackardios/laravel-query-wizard:dev-master.
      # Resolve that constraint against this checkout instead of Packagist, so the
      # commit under test is the one the downstream package is compiled against.
      - name: Resolve the dependency against this checkout
        working-directory: elastic-query-wizard
        run: |
          composer config repositories.laravel-query-wizard \
            '{"type":"path","url":"../laravel-query-wizard","options":{"symlink":false,"versions":{"jackardios/laravel-query-wizard":"dev-master"}}}'

      - name: Install dependencies
        working-directory: elastic-query-wizard
        run: composer update --prefer-dist --no-interaction --no-progress

      # Guards against the path repository being silently ignored, which would
      # turn this job into a second copy of the downstream package's own CI.
      - name: Confirm the local checkout was used
        working-directory: elastic-query-wizard
        run: |
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true);
            foreach ($lock["packages"] as $package) {
                if ($package["name"] !== "jackardios/laravel-query-wizard") {
                    continue;
                }
                $type = $package["dist"]["type"] ?? "?";
                echo "resolved from: {$type}\n";
                exit($type === "path" ? 0 : 1);
            }
            fwrite(STDERR, "jackardios/laravel-query-wizard is not installed\n");
            exit(1);
          '

      - name: Run PHPStan
        working-directory: elastic-query-wizard
        run: vendor/bin/phpstan analyse --memory-limit=512M

      # The Unit suite needs no Elasticsearch or MySQL and is what catches a
      # removed or reshaped base-class method.
      - name: Run unit tests
        working-directory: elastic-query-wizard
        run: vendor/bin/phpunit --testsuite=Unit --colors=always

  security-audit:
    # Replaces roave/security-advisories: as a conflict-only package it made every
    # EOL Laravel leg unresolvable, since advisories against 10.x/11.x have no
    # patched release to move to.
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-audit-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-audit-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit

  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-style-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-style-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  coverage:
    name: Coverage and mutation testing (PHP 8.4 / Laravel 13)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: pcov
          tools: composer:v2, infection:0.35

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-coverage-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-coverage-composer-

      - name: Install dependencies
        run: composer update --with="laravel/framework:^13.0" --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=build/coverage/clover.xml --only-summary-for-coverage-text

      # Report-only until the surviving mutants are triaged; minMsi in infection.json5 then becomes the floor.
      # A full run takes too long for every push, so pushes and pull requests mutate only changed lines.
      - name: Run mutation testing on changed lines
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          infection --threads=max --no-progress --git-diff-lines --git-diff-base="${base}" --ignore-msi-with-no-mutations

      - name: Run mutation testing
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: infection --threads=max --no-progress

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-and-mutation
          path: build/
          if-no-files-found: ignore

  experimental:
    name: Experimental (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows, PHP 8.4 / Laravel 13
            os: windows-latest
            php: '8.4'
            extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo_sqlite, sqlite3
            install: composer update --with="laravel/framework:^13.0" --prefer-dist --no-interaction --no-progress
          - name: PHP 8.6 / Laravel 13
            os: ubuntu-latest
            php: '8.6'
            extensions: dom, curl, libxml, mbstring, zip
            install: composer update --with="laravel/framework:^13.0" --ignore-platform-req=php+ --prefer-dist --no-interaction --no-progress
          - name: PHP 8.4 / Laravel next
            os: ubuntu-latest
            php: '8.4'
            extensions: dom, curl, libxml, mbstring, zip
            # dev-master still carries a stale 13.0.x-dev branch alias, so it is aliased explicitly.
            # testbench has no next line; testbench-core 12.x-dev does, and Faker/Mockery were only
            # pulled in through testbench.
            install: >-
              composer config minimum-stability dev &&
              composer remove --dev orchestra/testbench --no-update &&
              composer require --dev "orchestra/testbench-core:12.x-dev" "mockery/mockery:^1.6" --no-update &&
              composer require "laravel/framework:dev-master as 14.0.0" --no-update &&
              composer update --prefer-dist --no-interaction --no-progress

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        shell: bash
        run: ${{ matrix.install }}

      - name: Show resolved versions
        shell: bash
        run: composer show -D | grep -E "^(laravel/framework|phpunit/phpunit) "

      - name: Run tests
        shell: bash
        run: vendor/bin/phpunit --colors=always --display-deprecations
